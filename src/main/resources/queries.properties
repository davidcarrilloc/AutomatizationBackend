consulta.cobro=select tx.id, \
    tip.pedido, \
    tip.remision, \
    tip.orden_venta, \
    tip.recognition_store, \
    tip.total_cobrado, \
    tip.id_cat_estatus, \
    tip.terminal, \
    tip.seller, \
    TX.TOTAL_SKUS, \
    TIP.FECHA_TX_COMPRA AS fecha_tx_compra, \
    TIP.atg_ship_grp_id, \
    ta.art_descripcion tipo_articulo, \
    SK.SKU_ID, \
    SK.SECCION, \
    DS.DISPLAY_NAME, \
    SK.PRECIO_VENTA, \
    SK.CANTIDAD, \
    DMS.TOTAL "totalSku", \
    tip.pedido, \
    tip.atg_order_id, \
    DMA.MONTO abono_med, \
    DMC.MONTO cargo_med, \
    DMS.IMPORTE_DESCTO_1ERDIA, \
    DMS.IMPORTE_CON_DESCTO_1ERDIA, \
    DMS.IMPORTE_DESCTO_CASA, \
    DMS.IMPORTE_DESCTO_FIJO, \
    SK.DESCUENTO_PORCENTUAL, \
    SK.ES_FLETE, \
    SK.IS_GIFT, \
    SK.MONEDERO_PROMO_TYPE, \
    SK.MONEDERO_PROMO_VALUE \
    from BRIDGECORE.tx TX \
    inner join BRIDGECORE.TX_INFORMACION_PROCESADA TIP ON TX.ID_INFO_PROCESADA = TIP.ID \
    inner join BRIDGECORE.TX_DETALLE_SKU SK ON TX.ID = SK.TX_ID \
    inner JOIN BRIDGECORE.TX_DETALLE_MONTO_SKU DMS ON SK.ID = DMS.ID_DETALLE_SKU \
    LEFT JOIN ATGCATA.DCS_SKU@catalog_link_pro DS ON SK.SKU_ID = DS.SKU_ID \
    LEFT JOIN BRIDGECORE.TX_INFORMACION_DE_PAGO IP ON TX.ID_INFO_PAGO = IP.ID \
    LEFT JOIN BRIDGECORE.TX_DETALLE_MONEDERO_ABONO DMA ON IP.ID_MONEDERO_ABONO_DETALLE = DMA.ID \
    LEFT JOIN BRIDGECORE.TX_DETALLE_MONEDERO_CARGO DMC ON IP.ID_MONEDERO_CARGO_DETALLE = DMC.ID \
    LEFT JOIN BRIDGECORE.CAT_TIPO_DE_PAGO CTP ON TX.ID_TIPO_DE_PAGO = CTP.ID \
    left JOIN BRIDGECORE.cat_tipo_articulo ta ON TX.id_tipo_articulo = ta.id \
    where TIP.atg_ship_grp_id IN (:atgShipGrpIds) \
    and tip.atg_order_id IN (:atgOrderIds) \
    and TIP.ID_CAT_ESTATUS = 0 \
    and TX.ID_TIPO_TX = 1
